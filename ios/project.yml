name: Steady
options:
  bundleIdPrefix: com.brando454
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    ENABLE_PREVIEWS: NO
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Steady:
    type: application
    platform: iOS
    sources:
      - path: Steady
        excludes:
          - Info.plist
          - Steady.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brando454.steady
        PRODUCT_NAME: Steady
        INFOPLIST_FILE: Steady/Info.plist
        CODE_SIGN_ENTITLEMENTS: Steady/Steady.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: SteadyWidget
        embed: true
  SteadyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SteadyWidget
        excludes:
          - Info.plist
          - SteadyWidget.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brando454.steady.widget
        PRODUCT_NAME: SteadyWidget
        INFOPLIST_FILE: SteadyWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: SteadyWidget/SteadyWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Steady:
    build:
      targets:
        Steady: all
        SteadyWidget: all
    run:
      config: Debug
    archive:
      config: Release
