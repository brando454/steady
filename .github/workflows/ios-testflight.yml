name: iOS TestFlight

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check signing helpers
        run: python3 ios/ci/test_appstore_signing.py

      - name: Generate the Xcode project
        run: brew install xcodegen && (cd ios && xcodegen generate)

      - name: Compile
        run: |
          cd ios
          xcodebuild \
            -project Steady.xcodeproj \
            -scheme Steady \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build

      - name: Signing secrets
        id: secrets
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          ready=true
          for name in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_P8 APPLE_TEAM_ID IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "$name is not set"
              ready=false
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Stop when a manual run has no signing secrets
        if: github.event_name == 'workflow_dispatch' && steps.secrets.outputs.ready != 'true'
        run: |
          echo "Add the six GitHub secrets, then run this again."
          exit 1

      # Pull requests only compile. A push to main, or a manual run, archives with the
      # existing distribution certificate. Do not pass -allowProvisioningUpdates.
      - name: Upload to TestFlight
        if: github.event_name != 'pull_request' && steps.secrets.outputs.ready == 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          cleanup() {
            rm -f "$RUNNER_TEMP/distribution.p12" "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -t 3600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          echo "$IOS_DISTRIBUTION_P12_BASE64" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          rm -f "$RUNNER_TEMP/distribution.p12"
          if curl -fsSL -o "$RUNNER_TEMP/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer; then
            security import "$RUNNER_TEMP/wwdr.cer" -k "$KEYCHAIN" >/dev/null || true
            rm -f "$RUNNER_TEMP/wwdr.cer"
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN" >/dev/null
          mkdir -p "$HOME/private_keys"
          echo "$APP_STORE_CONNECT_KEY_P8" | base64 -D > "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          SIGNING_KEYCHAIN="$KEYCHAIN" \
          ASC_KEY_PATH="$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
          PBXPROJ="$PWD/ios/Steady.xcodeproj/project.pbxproj" \
          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist" \
            python3 ios/ci/appstore_signing.py
          cd ios
          xcodebuild \
            -project Steady.xcodeproj \
            -scheme Steady \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Steady.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=Apple Distribution" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Steady.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA="$(find "$RUNNER_TEMP/export" -name '*.ipa' -print -quit)"
          test -n "$IPA"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
